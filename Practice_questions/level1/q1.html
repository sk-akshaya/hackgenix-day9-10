<!--1. Select an h1 by its id and change its text with JavaScript.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="heading">Hello Everyone!!</h1>

<script>
    const h1=document.getElementById("heading");
    h1.textContent="Hii There!!";
</script>
    
</body>
</html>
