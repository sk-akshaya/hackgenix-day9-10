<!--2. Select all p tags and change their colour to blue using a loop.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>apple</p>
    <p>mango</p>
    <p>banana</p>
    <p>grapes</p>
    <p>orange</p>

    <script>
        const fruits=document.querySelectorAll("p");
        for(let fruit of fruits){
            fruit.style.color="blue";            
        }
    </script>
</body>
</html>
