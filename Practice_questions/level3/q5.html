<!--5. Build a quiz app: show one question at a time, calculate the score, and save the best score in localStorage.-->

<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>
</head>
<body>
    <h2>Quiz App</h2>
    <h3 id="question"></h3>
    <div id="options"></div>
    <button onclick="nextQuestion()">Next</button>
    <h3 id="result"></h3>
    <h3 id="bestScore"></h3>
    <script>
        let quiz = [
            {
                question: "What is the full form of HTML?",
                options: ["Hyper Text Markup Language", "High Text Machine Language", "Hyper Tool Markup Language", "Home Text Markup Language"],
                answer: "Hyper Text Markup Language"
            },
            {
                question: "Which language is used for styling web pages?",
                options: ["HTML", "CSS", "JavaScript", "Python"],
                answer: "CSS"
            },
            {
                question: "Which language is used to make web pages interactive?",
                options: ["HTML", "CSS", "JavaScript", "SQL"],
                answer: "JavaScript"
            }
        ];
        let index = 0;
        let score = 0;
        let selected = "";
        function showQuestion() {
            document.getElementById("question").innerHTML = quiz[index].question;
            let output = "";
            quiz[index].options.forEach(function(option) {
                output += `<button onclick="selectAnswer('${option}')">${option}</button><br><br>`;
            });
            document.getElementById("options").innerHTML = output;
            selected = "";
        }
        function selectAnswer(option) {
            selected = option;
        }
        function nextQuestion() {
            if (selected === "") {
                alert("Please select an answer");
                return;
            }
            if (selected === quiz[index].answer) {
                score++;
            }
            index++;
            if (index < quiz.length) {
                showQuestion();
            }
            else {
                document.getElementById("question").innerHTML = "Quiz Completed!";
                document.getElementById("options").innerHTML = "";
                document.getElementById("result").innerHTML =
                    "Your Score: " + score + "/" + quiz.length;
                let best = localStorage.getItem("bestScore") || 0;
                if (score > best) {
                    best = score;
                    localStorage.setItem("bestScore", best);
                }
                document.getElementById("bestScore").innerHTML =
                    "Best Score: " + best;

                document.querySelector("button").style.display = "none";
            }
        }

        showQuestion();

        document.getElementById("bestScore").innerHTML =
            "Best Score: " + (localStorage.getItem("bestScore") || 0);
    </script>
</body>
</html>
