<!--7. Show the number of characters typed in a textarea, with a limit of 100.-->

<!DOCTYPE html>
<html>
<head>
    <title>Character Counter</title>
</head>
<body>
    <textarea id="text" maxlength="100" oninput="countCharacters()"></textarea>
    <p id="count">0 / 100 characters</p>
    <script>
        function countCharacters() {
            let text = document.getElementById("text").value;
            document.getElementById("count").innerHTML =
                text.length + " / 100 characters";
        }
    </script>

</body>
</html>
