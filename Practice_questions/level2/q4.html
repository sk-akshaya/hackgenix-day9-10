<!--4. Create a form with name and age. On submit, show a greeting; show an error if the age is below 18.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
</head>
<body>

    <form id="form">
        <input id="name" type="text" placeholder="Enter your name" required>
        <input id="age" type="number" placeholder="Enter your age" required>
        <button type="submit">Submit</button>
    </form>
    <script>
        const form = document.getElementById("form");
        const name = document.getElementById("name");
        const age = document.getElementById("age");
        form.addEventListener('submit', (event) => {
            event.preventDefault();

            if (Number(age.value) < 18) {
                alert("You are not eligible to vote");
            } else {
                alert("Hello " + name.value + "! Thank you for submitting");
            }
        });
    </script>

</body>
</html>

</body>
</html>
