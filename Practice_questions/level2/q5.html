<!--5. Change an image when the user clicks small thumbnails (use data-src attributes)-->

<!DOCTYPE html>
<html>
<head>
    <title>document</title>
    <style>
        .thumbnail {
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h2>Image Gallery</h2>
    <img id="mainImage" width="300px" src="./images/4cc11f28b8409315ad8efcbb405ba4f5.jpg">
    <br><br>
    <img class="thumbnail" width="80px" data-src="./images/images.jpg" src="./images/images.jpg">
    <img class="thumbnail" width="80px" data-src="./images/flower.jpg" src="./images/flower.jpg">
    <img class="thumbnail" width="80px" data-src="./images/nature.jpg" src="./images/nature.jpg">

    <script>
        const mainImage = document.getElementById("mainImage");
        const thumbnails = document.querySelectorAll(".thumbnail");
        for (let thumbnail of thumbnails) {
            thumbnail.addEventListener("click", () => {
                mainImage.src = thumbnail.dataset.src;
            });

        }
    </script>

</body>
</html>
